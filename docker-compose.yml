services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017/Medlink-Management
      - REDIS_URL=redis://redis:6379
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo
    ports:
      - "27018:27017"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
